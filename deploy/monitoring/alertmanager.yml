global:
  resolve_timeout: 5m

route:
  receiver: operations-webhook
  group_by:
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: operations-webhook
      matchers:
        - severity="critical"
      repeat_interval: 30m

receivers:
  - name: operations-webhook
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
